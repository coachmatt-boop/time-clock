<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6f8"><title>Welcome to Illusion</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f4f6f8;color:#111}body{overscroll-behavior:none}.shell{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}.logo{width:min(66vw,320px);max-height:90px;object-fit:contain;margin:4px 0 12px}.clock{font-size:clamp(36px,11vw,62px);font-weight:800;line-height:1}.date{font-size:clamp(16px,4vw,22px);margin:7px 0 15px;color:#555;text-align:center}h1{margin:0;font-size:clamp(27px,7vw,44px)}.greet{margin:7px 0 4px;font-size:clamp(18px,4.5vw,25px);color:#444}.instruction{margin-bottom:16px;font-size:clamp(16px,4vw,21px);color:#555;text-align:center}#reader{width:min(94vw,520px);background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.12)}#status{margin-top:13px;color:#666;min-height:22px;text-align:center}#result{display:none;position:fixed;inset:0;z-index:1000;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:28px}#result.success{background:#eefaf1}#result.error{background:#fff1f1}.rlogo{width:min(62vw,300px);max-height:80px;object-fit:contain;margin-bottom:28px}#rgreet{font-size:clamp(23px,6vw,36px);font-weight:700;margin-bottom:8px}#name{font-size:clamp(38px,11vw,68px);font-weight:900;margin-bottom:18px}#message{font-size:clamp(34px,9vw,62px);font-weight:900;line-height:1.05}#rtime{font-size:clamp(36px,10vw,64px);font-weight:800;margin-top:18px}#fun{font-size:clamp(17px,4.5vw,25px);max-width:600px;margin-top:24px;color:#444;font-weight:600}</style></head><body>
<div class="shell"><img class="logo" src="https://illusiondc.com/wp-content/uploads/2025/09/IDC_Primary-Logo-Black.svg" alt="Illusion"><div class="clock" id="clock">--:--</div><div class="date" id="date"></div><h1>WELCOME</h1><div class="greet" id="greet"></div><div class="instruction">Scan your employee QR code to get started</div><div id="reader"></div><div id="status">Starting camera…</div></div>
<div id="result"><img class="rlogo" src="https://illusiondc.com/wp-content/uploads/2025/09/IDC_Primary-Logo-Black.svg" alt="Illusion"><div id="rgreet"></div><div id="name"></div><div id="message"></div><div id="rtime"></div><div id="fun"></div></div>
<script>const SCRIPT_URL="https://script.google.com/macros/s/AKfycbz-ffNozIKCHgojWoIKgeW-mxhrgGK3f50IdMHcEOsVBdK6vBU9WBq-l0E3SpQ2G_jlFQ/exec",IN_MESSAGES=["Good morning — let’s make something brilliant.", "Welcome back — let’s get creating.", "You made it. Coffee next?", "Ready to make some magic?", "Another day, another masterpiece.", "Clocked in — looking suspiciously productive.", "Welcome aboard. The workshop awaits.", "Another beautiful day at Illusion.", "Good to see you — let’s get started.", "You’re in. Let the organised chaos commence.", "Time to turn ideas into something real.", "Morning! The day’s officially started.", "Welcome in — go make something impressive.", "Ready when you are.", "Here we go again — in the best possible way.", "Clocked in. Creativity mode activated.", "Nice to see you — have a good one.", "Your day at Illusion starts now.", "Morning! Let’s see what today brings.", "You’re officially on the clock.", "Welcome back to the organised chaos.", "Another day of making the impossible possible.", "Good morning — tools, coffee, action.", "Clocked in. Let’s build something worth talking about.", "Welcome! Today’s blank canvas awaits.", "Morning — let’s make today a good one.", "You’re in. Time to work some Illusion magic.", "Good to have you here.", "Clocked in — let the making begin.", "Welcome back. The workshop missed you.", "Morning! Your mission has officially begun.", "You’re here — productivity levels rising.", "Clocked in. Let’s make it happen.", "Good morning — another chance to make cool stuff.", "Welcome in. Please proceed to create something ridiculous.", "Morning! Try not to lose your tape measure.", "Clocked in — the coffee machine believes in you.", "You’ve arrived. Things can happen now.", "Welcome back — somebody has to make the magic happen.", "Morning! Let’s turn drawings into reality.", "Clocked in. Excellent decision.", "You’re in — let’s make something the client didn’t think was possible.", "Good morning. Scenic wizardry may now commence.", "Welcome! Another day at the home of ambitious ideas.", "Clocked in — competence mode enabled.", "Morning. Let the sawdust settle where it may.", "You’re here! The day just got more productive.", "Welcome back. Let’s make something unnecessarily impressive.", "Clocked in — another adventure begins.", "Good morning. Let’s make today look easy."],OUT_MESSAGES=["Nice one — get yourself home.", "That’ll do. See you next time!", "Tools down. Freedom awaits.", "You survived another one!", "Great work today — go put your feet up.", "Clocked out. Work mode officially disabled.", "Escape successful. See you next time.", "Another day in the bag.", "Go home before somebody finds you another job.", "You’re free! Until next time…", "All done — have a good evening.", "Nice work. Time to switch off.", "Clocked out — mission accomplished.", "That’s your lot. Enjoy the rest of your day.", "Good job today. See you tomorrow.", "Done and dusted.", "Clocked out. Your sofa is expecting you.", "Another productive day successfully completed.", "That’s a wrap!", "Home time officially authorised.", "Work complete. Personal time activated.", "Clocked out — you may now ignore emails responsibly.", "Nice one. Go enjoy your evening.", "Finished! The workshop will still be here tomorrow.", "Day complete. Recharge required.", "You’re out — thanks for today.", "Clocked out. Go do something that isn’t work.", "That’s enough productivity for one day.", "Another one completed. Good work.", "Home time unlocked.", "Clocked out — freedom level restored.", "All done. See you on the other side.", "Great effort today — time to disappear.", "Your work here is done.", "Clocked out. Exit music starts now.", "Another day conquered.", "Done. Go reclaim your evening.", "That’s a wrap — excellent escaping.", "Clocked out. The tools can fend for themselves now.", "Nice work — go somewhere without a risk assessment.", "You made it to home time. Congratulations.", "Clocked out — productivity can resume tomorrow.", "That’s today sorted.", "Work mode: OFF.", "Another day of making impossible things look easy — done.", "Clocked out. Please proceed directly to relaxation.", "You’re done — leave before the PM finds you.", "All finished. Try not to dream about deadlines.", "Escape complete. See you for the next adventure.", "Clocked out — thanks for making the magic happen."];let scanner=null,processing=false,cameraStarted=false,wakeLock=null,jsonpTimeout=null;const $=id=>document.getElementById(id);function greeting(){let h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}function tick(){let n=new Date();$('clock').textContent=n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});$('date').textContent=n.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});$('greet').textContent=greeting()}tick();setInterval(tick,1000);function random(a){return a[Math.floor(Math.random()*a.length)]}async function wake(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});async function full(){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){}}async function start(){processing=false;$('result').style.display='none';$('status').textContent='Starting camera…';try{if(scanner)try{await scanner.clear()}catch(e){}scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'user'},{fps:10,qrbox:(w,h)=>{let s=Math.floor(Math.min(w,h)*.72);return{width:s,height:s}},aspectRatio:1,disableFlip:false},scan,()=>{});cameraStarted=true;$('status').textContent='Ready when you are'}catch(e){cameraStarted=false;$('status').textContent='Camera unavailable — tap the screen to retry'}}async function stop(){if(!scanner)return;if(cameraStarted)try{await scanner.stop()}catch(e){}try{await scanner.clear()}catch(e){}cameraStarted=false;scanner=null}async function scan(text){if(processing)return;let token=String(text||'').trim();if(!token)return;processing=true;$('status').textContent='Just a moment…';await stop();send(token)}function send(token){let cb='__clock_'+Date.now();window[cb]=r=>{clearTimeout(jsonpTimeout);cleanup(cb);show(r)};let s=document.createElement('script');s.id=cb;s.src=SCRIPT_URL+'?action=clock&token='+encodeURIComponent(token)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();s.onerror=()=>{cleanup(cb);show({success:false,message:'PLEASE TRY AGAIN'})};document.body.appendChild(s);jsonpTimeout=setTimeout(()=>{cleanup(cb);show({success:false,message:'PLEASE TRY AGAIN'})},12000)}function cleanup(cb){let s=$(cb);if(s)s.remove();try{delete window[cb]}catch(e){}}function first(n){n=String(n||'').trim();return n?n.split(/\s+/)[0]:''}function show(r){let p=first(r.name);$('name').textContent=p;$('rtime').textContent=r.time||'';if(r.success&&r.status==='IN'){$('rgreet').textContent=greeting()+(p?',':'');$('message').textContent="YOU'RE CLOCKED IN ✓";$('fun').textContent=random(IN_MESSAGES)}else if(r.success&&r.status==='OUT'){$('rgreet').textContent=p?'All done for today,':'';$('message').textContent="YOU'RE CLOCKED OUT ✓";$('fun').textContent=random(OUT_MESSAGES)}else{$('rgreet').textContent='';$('message').textContent=r.message||'PLEASE TRY AGAIN';$('fun').textContent='If this keeps happening, please speak to your supervisor'}$('result').className=r.success?'success':'error';$('result').style.display='flex';setTimeout(()=>{$('result').style.display='none';start()},3500)}async function interact(){await full();if(!cameraStarted&&!processing){await stop();start()}}document.addEventListener('click',interact,{once:true});document.addEventListener('touchstart',interact,{once:true});window.addEventListener('load',async()=>{await wake();start()});</script></body></html>
