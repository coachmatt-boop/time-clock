<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Time & Attendance</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #111;
    }
    .shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 18px;
    }
    h1 {
      margin: 8px 0 4px;
      font-size: clamp(30px, 6vw, 54px);
      text-align: center;
    }
    .subtitle {
      margin-bottom: 24px;
      font-size: clamp(18px, 3vw, 28px);
      text-align: center;
    }
    #reader {
      width: min(92vw, 560px);
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
    }
    .statusline {
      margin-top: 18px;
      font-size: 18px;
      color: #555;
      text-align: center;
    }
    .retry {
      display:none;
      margin-top:18px;
      padding:14px 22px;
      border:0;
      border-radius:10px;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="shell">
    <h1>TIME &amp; ATTENDANCE</h1>
    <div class="subtitle">Present your employee QR pass</div>
    <div id="reader"></div>
    <div class="statusline" id="statusline">Starting camera…</div>
    <button class="retry" id="retry">Retry camera</button>
  </div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz-ffNozIKCHgojWoIKgeW-mxhrgGK3f50IdMHcEOsVBdK6vBU9WBq-l0E3SpQ2G_jlFQ/exec';

  let scanner = null;
  let processing = false;
  let retryCount = 0;

  const statusline = document.getElementById('statusline');
  const retryBtn = document.getElementById('retry');

  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function startScanner() {
    processing = false;
    retryBtn.style.display = 'none';
    statusline.textContent = 'Starting camera…';

    try {
      if (scanner) {
        try {
          const state = scanner.getState ? scanner.getState() : null;
          if (state === 2 || state === 3) {
            await scanner.stop();
          }
        } catch (e) {}

        try {
          await scanner.clear();
        } catch (e) {}
      }

      scanner = new Html5Qrcode('reader');

      await scanner.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: function(viewfinderWidth, viewfinderHeight) {
            const size = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.72);
            return { width: size, height: size };
          },
          aspectRatio: 1.0,
          disableFlip: false
        },
        onScanSuccess,
        function() {}
      );

      retryCount = 0;
      statusline.textContent = 'Ready to scan';

    } catch (err) {
      console.error(err);
      retryCount++;

      if (retryCount <= 3) {
        statusline.textContent = 'Reconnecting camera…';
        await delay(1200);
        return startScanner();
      }

      statusline.textContent = 'Camera unavailable. Tap Retry camera.';
      retryBtn.style.display = 'inline-block';
    }
  }

  async function onScanSuccess(decodedText) {
    if (processing) return;
    processing = true;

    const token = String(decodedText || '').trim();
    if (!token) {
      processing = false;
      return;
    }

    statusline.textContent = 'Processing…';

    try {
      if (scanner) {
        await scanner.stop();
      }
    } catch (e) {
      console.warn(e);
    }

    const cleanReturnUrl = window.location.origin + window.location.pathname + '?returned=1';

    const target =
      SCRIPT_URL +
      '?action=clock' +
      '&token=' + encodeURIComponent(token) +
      '&returnUrl=' + encodeURIComponent(cleanReturnUrl);

    window.location.href = target;
  }

  retryBtn.addEventListener('click', function() {
    retryCount = 0;
    startScanner();
  });

  window.addEventListener('pageshow', async function() {
    const params = new URLSearchParams(window.location.search);
    const returned = params.get('returned') === '1';

    if (returned) {
      // Remove the flag from the visible URL without reloading.
      history.replaceState(null, '', window.location.pathname);
      statusline.textContent = 'Reconnecting camera…';
      await delay(1500);
    }

    startScanner();
  });
</script>
</body>
</html>
