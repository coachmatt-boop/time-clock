<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Time & Attendance</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #111;
    }
    .shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 26px 18px;
    }
    h1 {
      margin: 8px 0 4px;
      font-size: clamp(30px, 6vw, 54px);
      text-align: center;
    }
    .subtitle {
      margin-bottom: 24px;
      font-size: clamp(18px, 3vw, 28px);
      text-align: center;
    }
    #reader {
      width: min(92vw, 560px);
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
    }
    .statusline {
      margin-top: 18px;
      font-size: 18px;
      color: #555;
      text-align: center;
    }
    #result {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 32px;
    }
    #result.success { background: #eefaf1; }
    #result.error { background: #fff1f1; }
    #name {
      font-size: clamp(34px, 7vw, 64px);
      font-weight: 700;
      margin-bottom: 22px;
    }
    #message {
      font-size: clamp(42px, 9vw, 78px);
      font-weight: 800;
      line-height: 1.05;
    }
    #time {
      font-size: clamp(40px, 8vw, 72px);
      margin-top: 24px;
      font-weight: 700;
    }
    .retry {
      display:none;
      margin-top:18px;
      padding:14px 22px;
      border:0;
      border-radius:10px;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
    }
  </style>
</head>
<body>

  <div class="shell">
    <h1>TIME &amp; ATTENDANCE</h1>
    <div class="subtitle">Present your employee QR pass</div>
    <div id="reader"></div>
    <div class="statusline" id="statusline">Starting camera…</div>
    <button class="retry" id="retry">Retry camera</button>
  </div>

  <div id="result">
    <div id="name"></div>
    <div id="message"></div>
    <div id="time"></div>
  </div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz-ffNozIKCHgojWoIKgeW-mxhrgGK3f50IdMHcEOsVBdK6vBU9WBq-l0E3SpQ2G_jlFQ/exec';

  let scanner = null;
  let processing = false;
  let cameraStarted = false;
  let jsonpTimeout = null;

  const statusline = document.getElementById('statusline');
  const retryBtn = document.getElementById('retry');
  const resultEl = document.getElementById('result');
  const nameEl = document.getElementById('name');
  const messageEl = document.getElementById('message');
  const timeEl = document.getElementById('time');

  async function startScanner() {
    processing = false;
    retryBtn.style.display = 'none';
    resultEl.style.display = 'none';

    try {
      scanner = new Html5Qrcode('reader');

      await scanner.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: function(viewfinderWidth, viewfinderHeight) {
            const size = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.72);
            return { width: size, height: size };
          },
          aspectRatio: 1.0,
          disableFlip: false
        },
        onScanSuccess,
        function() {}
      );

      cameraStarted = true;
      statusline.textContent = 'Ready to scan';

    } catch (err) {
      console.error(err);
      cameraStarted = false;
      statusline.textContent = 'Camera unavailable. Allow camera access for this site.';
      retryBtn.style.display = 'inline-block';
    }
  }

  async function stopScanner() {
    if (!scanner || !cameraStarted) return;

    try {
      await scanner.stop();
    } catch (e) {
      console.warn(e);
    }

    try {
      await scanner.clear();
    } catch (e) {}

    cameraStarted = false;
    scanner = null;
  }

  async function onScanSuccess(decodedText) {
    if (processing) return;

    const token = String(decodedText || '').trim();
    if (!token) return;

    processing = true;
    statusline.textContent = 'Processing…';

    await stopScanner();
    sendClockRequest(token);
  }

  function sendClockRequest(token) {
    const callbackName = '__clockResult_' + Date.now();

    window[callbackName] = function(result) {
      clearTimeout(jsonpTimeout);
      cleanupJsonp(callbackName);
      showResult(result);
    };

    const script = document.createElement('script');
    script.id = callbackName;
    script.src =
      SCRIPT_URL +
      '?action=clock' +
      '&token=' + encodeURIComponent(token) +
      '&callback=' + encodeURIComponent(callbackName) +
      '&_=' + Date.now();

    script.onerror = function() {
      clearTimeout(jsonpTimeout);
      cleanupJsonp(callbackName);
      showResult({
        success: false,
        name: '',
        message: 'NETWORK ERROR',
        time: ''
      });
    };

    document.body.appendChild(script);

    jsonpTimeout = setTimeout(function() {
      cleanupJsonp(callbackName);
      showResult({
        success: false,
        name: '',
        message: 'NO RESPONSE',
        time: ''
      });
    }, 12000);
  }

  function cleanupJsonp(callbackName) {
    const script = document.getElementById(callbackName);
    if (script) script.remove();

    try {
      delete window[callbackName];
    } catch (e) {
      window[callbackName] = undefined;
    }
  }

  function showResult(result) {
    nameEl.textContent = result.name || '';
    messageEl.textContent = result.message || '';
    timeEl.textContent = result.time || '';

    resultEl.className = result.success ? 'success' : 'error';
    resultEl.style.display = 'flex';

    setTimeout(function() {
      resultEl.style.display = 'none';
      startScanner();
    }, 2500);
  }

  retryBtn.addEventListener('click', async function() {
    await stopScanner();
    startScanner();
  });

  window.addEventListener('load', startScanner);
</script>

</body>
</html>
